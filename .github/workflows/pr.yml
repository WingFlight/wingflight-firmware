name: PR-CI

on:
  pull_request:
    branches:
      - 'master'
      - 'RF-*'

env:

  TARGETS: unified

jobs:

  ci-build:

    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Install ARM tools
      run: make arm_sdk_install

    - name: Set build variables
      run: |
        PR=${GITHUB_REF}
        PR=${PR%%/merge}
        PR=${PR##*/}
        echo "GIT_PR=${PR}" >> ${GITHUB_ENV}
        echo "GIT_VER=PR${PR}-${GITHUB_SHA:0:7}" >> ${GITHUB_ENV}
        cat ${GITHUB_ENV}

    - name: Build HEX files for multiple targets
      run: make ${{ env.TARGETS }} FC_VER_SUFFIX="${{ env.GIT_VER }}" FLASH_CONFIG_ERASE=yes

    - name: Move HEX
      run: mv -v obj/*STM32*.hex .

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: wingflight-${{ env.GIT_VER }}
        path: wingflight*.hex

  # The unit test suite has been in the tree without anything running it, so
  # nothing noticed when a test stopped building. It runs under clang, which is
  # what src/test/Makefile defaults to, and that accepts clang 7 to 18:
  # ubuntu-24.04 has 18, while ubuntu-latest is moving to an image with 21.
  # The top-level Makefile checks for the ARM compiler before it gets to
  # src/test, so the tests need it installed too.
  unit-tests:

    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
    - name: Check out repository
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Install ARM tools
      run: make arm_sdk_install

    - name: Run the unit test suite
      run: make test

  # The manifest is what the configurator uses to turn a setting name into a
  # (pgn, offset), so it has to keep agreeing both with the CLI's own table and
  # with the binary that ships. One target is enough to catch a change to the
  # extractor or to a shared struct; a target-specific divergence would show up
  # at release, where every target is built anyway.
  manifest-check:

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
    - name: Check out repository
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Install ARM tools
      run: make arm_sdk_install

    - name: Install manifest tooling
      run: pip install pyelftools==0.31 pycparser==2.22

    - name: Test the MSP codec extractor
      run: python src/utils/test_wf_msp_codecs.py

    - name: Check the manifest against the CLI table and the shipping build
      run: make manifest_check TARGET=STM32F411

